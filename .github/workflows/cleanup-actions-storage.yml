name: Clear GitHub Actions artifacts and caches
on:
  push:
    paths:
      - '.github/workflows/cleanup-actions-storage.yml'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete retained artifacts and caches in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          echo "Cleaning artifacts in $repo"
          gh api --paginate "repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r id; do
            [ -z "$id" ] && continue
            gh api -X DELETE "repos/$repo/actions/artifacts/$id" >/dev/null
            echo "Deleted artifact $id"
          done
          echo "Cleaning caches in $repo"
          gh api --paginate "repos/$repo/actions/caches?per_page=100" --jq '.actions_caches[].id' | while read -r id; do
            [ -z "$id" ] && continue
            gh api -X DELETE "repos/$repo/actions/caches/$id" >/dev/null
            echo "Deleted cache $id"
          done
          echo "GitHub Actions artifact/cache cleanup complete"
